<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>铁路原声 · 波形校时台</title>
<style>
:root{color-scheme:dark;--bg:#171f1c;--panel:#24302a;--ink:#eee7d6;--muted:#b3bcae;--gold:#dab777;--rail:#465346;--red:#efad89;--mint:#91c3aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select,input[type=number]{background:#303d33;border:1px solid #61705c;border-radius:7px;padding:9px 12px;min-height:40px}button{cursor:pointer}button:hover{border-color:var(--gold);background:#3c4938}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:#d4b27a;color:#20281f;font-weight:650;border-color:#d4b27a}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.spacer{flex:1}header{padding:17px 22px 12px;border-bottom:1px solid var(--rail);background:#202b25}h1{font-size:21px;margin:0 0 12px;letter-spacing:.04em}small,.muted{color:var(--muted);font-size:13px;line-height:1.6}#song{max-width:100%;width:min(640px,100%)}#message{min-height:23px;margin-top:8px;color:var(--mint)}#saveState{color:var(--gold);font-size:13px}#summary{margin-top:8px;color:var(--muted);font-size:13px}audio{height:40px;width:min(360px,100%)}.studio{position:sticky;top:0;z-index:3;background:#202b25;box-shadow:0 6px 14px #0004;padding:12px 22px;border-bottom:1px solid var(--rail)}#selectedTitle{font-size:17px;margin:0 0 10px;font-weight:600}#clock{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}.wave-wrap{position:relative;background:#121c18;border:1px solid #52614e;border-radius:9px;margin:10px 0;overflow:hidden;height:175px}canvas{display:block;width:100%;height:175px;touch-action:none}#region{position:absolute;top:28px;height:105px;background:#c2a16125;border:1px solid #c5aa72;min-width:2px;cursor:grab;touch-action:none}#region:active{cursor:grabbing}.handle{position:absolute;top:-1px;bottom:-1px;width:26px;border:0;background:#d0ad70d9;padding:0;min-height:0;touch-action:none;color:#17221a;font-weight:900;border-radius:5px;cursor:ew-resize}.handle:hover{background:#efd095;color:#17221a}.handle.start{left:-13px}.handle.end{right:-13px}.fine{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.fine input[type=number]{width:110px;font-variant-numeric:tabular-nums}.fine label,.play-options label{display:inline-flex;gap:7px;align-items:center}.fine .group{display:flex;align-items:center;gap:5px}.nudge{padding:6px 9px}.play-options{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:10px 0}.play-options input[type=number]{width:74px;min-height:34px;padding:5px}input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px}.range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.seek{width:100%;accent-color:var(--gold);min-height:24px}.legend{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.5}main{padding:16px 22px 60px;max-width:1400px;margin:auto}.list-controls{margin-bottom:12px}article{padding:13px 15px;margin:9px 0;background:#253128;border:1px solid #394936;border-left:3px solid #627559;border-radius:8px}article.flagged{border-left-color:#d79065}article.selected{border-color:var(--gold);background:#354032}article.active{box-shadow:inset 0 0 0 1px #a8c4a2}article.invalid{border-right:3px solid var(--red)}.row-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row-head label{display:flex;align-items:center;gap:6px;margin-left:auto}.time-label{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}.meta{color:var(--muted);font-size:12px;margin:7px 0;overflow-wrap:anywhere}textarea{width:100%;border:1px solid #596951;border-radius:6px;background:#1d281f;padding:9px;resize:vertical;font-size:17px;line-height:1.5}.heard{color:var(--muted);white-space:pre-wrap}#empty{padding:20px;color:var(--muted)}.file-label{position:relative;border:1px solid #61705c;padding:9px 12px;border-radius:7px;cursor:pointer;display:inline-block}.file-label input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.file-label:focus-within{outline:2px solid var(--gold)}@media(max-width:760px){header,.studio,main{padding-left:12px;padding-right:12px}.studio{position:relative}.wave-wrap,canvas{height:155px}#region{height:90px}audio{width:100%}.fine .group{flex-wrap:wrap}.fine input[type=number]{width:95px}.row-head label{margin-left:0}}
</style>
<header>
<h1>铁路原声 / 波形校时台</h1>
<div class="toolbar"><select id="song" aria-label="曲目与校准版本"></select><span id="saveState" role="status">尚无改动</span><span class="spacer"></span>
<button id="save" class="primary">保存校时进度</button><label class="file-label">载入进度<input id="import" type="file" accept="application/json,.json" aria-label="载入校时进度文件"></label><button id="export">导出整首已核对稿</button></div>
<div id="summary"></div><div id="message" role="status" aria-live="polite"></div>
</header>
<section class="studio" aria-label="当前句波形编辑器">
<div class="toolbar"><div id="selectedTitle">选择一句开始核对</div><span class="spacer"></span><output id="clock">00:00.00</output><audio id="audio" controls preload="metadata"></audio></div>
<div class="toolbar"><button id="preview" class="primary">▶ 试听当前句</button><button id="toggle">播放 / 暂停</button><button id="extend">尾部再听 3 秒</button><label>速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label><button id="prev">上一句</button><button id="next">下一句</button><button id="zoomIn">放大波形</button><button id="zoomOut">缩小波形</button></div>
<div class="play-options"><label>句前 <input id="pre" type="number" min="0" max="15" step="0.5" value="1.5" aria-label="句前试听秒数">秒</label><label>句后 <input id="post" type="number" min="0" max="30" step="0.5" value="3" aria-label="句后试听秒数">秒</label><label><input id="bounded" type="checkbox">到片段末尾自动暂停</label><label><input id="repeat" type="checkbox">循环片段</label><span class="muted">默认连续播放，尾音不会被原来的句末强制截断。</span></div>
<div class="wave-wrap" id="waveWrap"><canvas id="wave" role="img" aria-label="原曲振幅波形，竖线为当前播放位置"></canvas><div id="region" title="拖动中间，整体平移起止范围"><button id="startHandle" class="handle start" aria-label="拖动或用左右方向键调整开始时间">↔</button><button id="endHandle" class="handle end" aria-label="拖动或用左右方向键调整结束时间">↔</button></div></div>
<div class="range-labels"><span id="viewStart"></span><span>原曲波形 · 点击空白定位；拖动金色把手校时</span><span id="viewEnd"></span></div>
<div class="fine"><div class="group"><label>开始 <input id="start" type="number" min="0" step="0.01" aria-label="当前句开始时间"></label><button class="nudge" data-bound="start" data-delta="-0.1">−0.1秒</button><button class="nudge" data-bound="start" data-delta="0.1">+0.1秒</button><button id="markStart">用播放位置设为开始</button></div><div class="group"><label>结束 <input id="end" type="number" min="0" step="0.01" aria-label="当前句结束时间"></label><button class="nudge" data-bound="end" data-delta="-0.1">−0.1秒</button><button class="nudge" data-bound="end" data-delta="0.1">+0.1秒</button><button id="markEnd">用播放位置设为结束</button></div></div>
<input id="seek" class="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="全曲播放位置"><p class="legend">波形反映声音强弱，不代表歌词识别准确率。金色范围是当前候选；试听留白与歌词起止是两回事。空格播放 / 暂停，左右键前后 0.25 秒（输入框内不抢快捷键）。</p>
</section>
<main><div class="toolbar list-controls"><label><input id="issuesOnly" type="checkbox">只看异常未核对句</label><span class="muted">可只核对疑点后保存进度；整首导出仍要求全部核对。自动保存保留在此浏览器，JSON备份可跨浏览器恢复。</span><span class="spacer"></span><label class="file-label">选择本地原曲<input id="audioFile" type="file" accept="audio/*" aria-label="选择本地原曲文件"></label></div><div id="rows"></div><div id="empty" hidden>当前筛选下没有待处理句。</div></main>
<script>
'use strict';
const reports=__REPORTS__, waveforms=__WAVEFORMS__;
const $=id=>document.getElementById(id), audio=$('audio'), song=$('song');
const names={south_wind:'南风',starlit_rails:'星光铁轨',chollima_ride:'千里马',sleepers:'铁轨沉睡者'};
let report,rows=[],selected=0,view={start:0,end:15},stopAt=Infinity,previewStart=0,drag=null,frame=0,saveTimer=0,scale=1;
const audioOverrides=new Map();const audioVerified=new Map();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function time(s){if(!Number.isFinite(s))return '--:--';const n=Math.round(Math.max(0,s)*100);return String(Math.floor(n/6000)).padStart(2,'0')+':'+String(Math.floor(n/100)%60).padStart(2,'0')+'.'+String(n%100).padStart(2,'0')}
function announce(s){$('message').textContent=s}
function key(){return 'railway-lyric-review-v2:'+report.reviewKey}
function current(){return rows[selected]}
function intervalValid(r){return Number.isFinite(r.start)&&Number.isFinite(r.end)&&r.start>=0&&r.end>r.start&&r.end<=report.duration}
function progress(){return {schemaVersion:2,id:report.id,reviewKey:report.reviewKey,reviewFile:report.reviewFile,audioSha256:report.audioSha256,model:report.model,status:'partial_listening_review',humanListeningVerified:false,savedAt:new Date().toISOString(),lines:rows.map(r=>({line:r.line,start:Number.isFinite(r.start)?r.start:null,end:Number.isFinite(r.end)?r.end:null,text:r.text,reviewed:r.reviewed})),selectedLine:selected+1}}
function persist(){clearTimeout(saveTimer);try{localStorage.setItem(key(),JSON.stringify(progress()));$('saveState').textContent='已自动保存 '+new Date().toLocaleTimeString()}catch{$('saveState').textContent='浏览器保存不可用，请点“保存校时进度”备份'}}
function queueSave(){clearTimeout(saveTimer);$('saveState').textContent='正在保存…';saveTimer=setTimeout(persist,180)}
function restore(data){if(!data||!Number.isInteger(data.selectedLine)||data.selectedLine<1||data.selectedLine>rows.length)throw Error('进度所选句号不正确');if(data.schemaVersion!==2||data.reviewKey!==report.reviewKey||data.audioSha256!==report.audioSha256||data.id!==report.id||!Array.isArray(data.lines)||data.lines.length!==rows.length)throw Error('曲目、音频或候选版本不匹配，未覆盖当前进度');const converted=data.lines.map((r,i)=>{if(r.line!==rows[i].line||typeof r.text!=='string'||(r.start!==null&&!Number.isFinite(r.start))||(r.end!==null&&!Number.isFinite(r.end)))throw Error('进度文件内容不正确');return {start:r.start===null?NaN:r.start,end:r.end===null?NaN:r.end,text:r.text,reviewed:r.reviewed===true}});converted.forEach((r,i)=>Object.assign(rows[i],r));selected=clamp((data.selectedLine||1)-1,0,rows.length-1)}
function download(data,name){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function make(tag,text,parent){const e=document.createElement(tag);if(text)e.textContent=text;parent.append(e);return e}
function priority(r){return r.reviewFile.includes('.provider.boundaries.')&&r.model.endsWith('/ original')?0:r.publishedDraft?1:2}
reports.map((r,i)=>({r,i})).sort((a,b)=>priority(a.r)-priority(b.r)||a.r.id.localeCompare(b.r.id)).forEach(({r,i})=>{const o=make('option','',song);o.value=i;o.textContent=(names[r.id]||r.id)+' · '+(priority(r)===0?'最新候选 · ':r.publishedDraft?'已打包草稿 · ':'历史 / 对照 · ')+r.model+' · '+r.reviewFile});
song.value=String(Math.max(0,reports.findIndex(r=>r.id==='starlit_rails'&&priority(r)===0)));
function render(){audio.pause();stopAt=Infinity;report=reports[+song.value];rows=report.lines.map(l=>({line:l.line,start:l.start,end:l.end,text:l.text,reviewed:false,flags:(report.issues.find(x=>x.line===l.line)||{}).flags||[],source:l}));selected=0;scale=1;let restored=false;try{const saved=localStorage.getItem(key());if(saved){restore(JSON.parse(saved));restored=true}}catch(e){announce('未自动恢复：'+e.message)}audio.src=audioOverrides.get(report.id)||'../../../Assets/Resources/bgm/'+report.id+'.mp3';audio.playbackRate=+$('speed').value;audio.preservesPitch=true;$('seek').max=report.duration;$('start').max=report.duration;$('end').max=report.duration;buildRows();select(selected);$('saveState').textContent=restored?'已恢复此候选的校时进度':'尚无改动';if(!restored)announce('选择句子后拖动金色范围；默认试听持续播放，不强制提前停止。')}
function buildRows(){const host=$('rows');host.replaceChildren();rows.forEach((r,i)=>{const c=make('article','',host);r.card=c;c.classList.toggle('flagged',r.flags.length>0);const head=make('div','',c);head.className='row-head';const focus=make('button','第 '+r.line+' 句 · 定位波形',head);focus.onclick=()=>select(i);const play=make('button','▶ 试听',head);play.setAttribute('aria-label','试听第'+r.line+'句');play.onclick=()=>preview(i);r.timeLabel=make('span','',head);r.timeLabel.className='time-label';const label=make('label','',head),check=make('input','',label);check.type='checkbox';check.checked=r.reviewed;label.append('已听核对');check.onchange=()=>{r.reviewed=check.checked;validate();queueSave();filterRows()};r.check=check;let meta='';if(Number.isFinite(r.source.phoneticScore))meta='音素得分 '+r.source.phoneticScore.toFixed(3)+'（不是时间准确率）';else if(Number.isFinite(r.source.asrAgreement))meta='ASR文字一致率 '+Math.round(r.source.asrAgreement*100)+'%';if(r.flags.length)meta+=' · '+r.flags.join(', ');make('div',meta,c).className='meta';const text=make('textarea','',c);text.value=r.text;text.rows=2;text.setAttribute('aria-label','第'+r.line+'句歌词');text.oninput=()=>{r.text=text.value;r.reviewed=false;r.check.checked=false;if(i===selected)$('selectedTitle').textContent='第 '+r.line+' 句 / '+r.text;validate();queueSave()};r.textInput=text;});validate();filterRows()}
function validate(){let previous=0,all=rows.length>0,heard=0,invalid=0;for(const r of rows){const valid=intervalValid(r)&&r.start>=previous&&r.text.trim().length>0;r.card.classList.toggle('invalid',!valid);r.timeLabel.textContent=time(r.start)+' → '+time(r.end);if(r.reviewed)heard++;if(!valid)invalid++;if(!valid||!r.reviewed)all=false;previous=Number.isFinite(r.end)?r.end:Infinity} $('export').disabled=!all||audioVerified.get(report.id)===false;$('summary').textContent=rows.length+'句 · 已听核对 '+heard+'句 · 区间问题 '+invalid+'句 · '+(report.publishedDraft?'已打包自动草稿，仍待听校':'候选数据，尚非已确认时间轴')}
function filterRows(){let shown=0;rows.forEach(r=>{r.card.hidden=$('issuesOnly').checked&&!(r.flags.length&&!r.reviewed);if(!r.card.hidden)shown++});$('empty').hidden=shown!==0}
function focusView(){const r=current();if(!r)return;const s=Number.isFinite(r.start)?r.start:0,e=Number.isFinite(r.end)?r.end:s+5;const width=Math.min(report.duration,Math.max(8,e-s+padding('pre')+padding('post')+2)*scale);view.start=clamp((s+e-width)/2,0,Math.max(0,report.duration-width));view.end=Math.min(report.duration,view.start+width)}
function select(i){stopAt=Infinity;selected=clamp(i,0,rows.length-1);rows.forEach((r,j)=>r.card.classList.toggle('selected',j===selected));const r=current();if(!r)return;$('selectedTitle').textContent='第 '+r.line+' 句 / '+r.text;syncInputs();focusView();draw()}
function syncInputs(){const r=current();$('start').value=Number.isFinite(r.start)?r.start.toFixed(2):'';$('end').value=Number.isFinite(r.end)?r.end.toFixed(2):''}
function changed(){const r=current();r.reviewed=false;r.check.checked=false;syncInputs();validate();draw();queueSave();if(Number.isFinite(stopAt))stopAt=previewEnd()}
function setBound(which,value){const r=current();if(!Number.isFinite(value)){r[which]=NaN;changed();return}r[which]=clamp(value,0,report.duration);changed()}
function padding(id){return clamp(Number.isFinite($(id).valueAsNumber)?$(id).valueAsNumber:0,0,id==='pre'?15:30)}
function previewEnd(){return Math.min(report.duration,current().end+padding('post'))}
async function play(){try{await audio.play()}catch{announce('无法播放。可点击“选择本地原曲”重新选择这首歌；音频只在本机读取。')}}
async function preview(i=selected){select(i);const r=current();if(!intervalValid(r)){announce('当前起止时间无效，请先调整金色范围或数字。');return}previewStart=Math.max(0,r.start-padding('pre'));stopAt=$('bounded').checked||$('repeat').checked?previewEnd():Infinity;audio.currentTime=previewStart;announce(Number.isFinite(stopAt)?'试听 '+time(previewStart)+' — '+time(stopAt)+'，已包含句后留白':'连续试听中；可随时暂停，拖音不会被候选句末截断。');await play()}
function updateClock(){const t=audio.currentTime||0;$('clock').textContent=time(t);$('seek').value=t;rows.forEach(r=>r.card.classList.toggle('active',t>=r.start&&t<r.end));if(!audio.paused&&Number.isFinite(stopAt)&&t>=stopAt){if($('repeat').checked){audio.currentTime=previewStart}else{audio.pause();stopAt=Infinity;announce('片段试听结束；点播放可继续，或增加句后留白。')}}draw()}
function tick(){frame=0;updateClock();if(!audio.paused)frame=requestAnimationFrame(tick)}
function draw(){const canvas=$('wave'),rect=canvas.getBoundingClientRect();if(!rect.width||!report)return;const dpr=Math.min(devicePixelRatio||1,2),w=rect.width,h=rect.height;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);const width=Math.max(.01,view.end-view.start),x=t=>(t-view.start)/width*w;const waveform=waveforms[report.id];c.strokeStyle='#34473a';c.lineWidth=1;c.beginPath();c.moveTo(0,h/2);c.lineTo(w,h/2);const step=width>35?5:width>15?2:1;for(let t=Math.ceil(view.start/step)*step;t<view.end;t+=step){const at=x(t);c.moveTo(at,0);c.lineTo(at,h);c.fillStyle='#a6b59e';c.font='11px system-ui';c.fillText(time(t),at+4,h-9)}c.stroke();if(waveform){const bins=waveform.peaks.length/2;c.strokeStyle='#89ad94';c.beginPath();for(let px=0;px<w;px++){const a=clamp(Math.floor((view.start+px/w*width)/waveform.duration*bins),0,bins-1),b=clamp(Math.ceil((view.start+(px+1)/w*width)/waveform.duration*bins),a+1,bins);let low=0,high=0;for(let j=a;j<b;j++){low=Math.min(low,waveform.peaks[2*j]);high=Math.max(high,waveform.peaks[2*j+1])}c.moveTo(px,h/2-low*h*.36/waveform.peak);c.lineTo(px,h/2-high*h*.36/waveform.peak)}c.stroke()}else{c.fillStyle='#b6bba3';c.fillText('暂无波形，仍可用时间框校时',14,45)}const r=current();if(r&&Number.isFinite(r.start)&&Number.isFinite(r.end)){const l=clamp(x(r.start),0,w),right=clamp(x(r.end),0,w);$('region').hidden=right<=l;$('region').style.left=l+'px';$('region').style.width=Math.max(2,right-l)+'px'}else $('region').hidden=true;const at=x(audio.currentTime||0);if(at>=0&&at<=w){c.strokeStyle='#f2d29a';c.lineWidth=2;c.beginPath();c.moveTo(at,0);c.lineTo(at,h-22);c.stroke()}$('viewStart').textContent=time(view.start);$('viewEnd').textContent=time(view.end)}
function atPointer(e){const rect=$('wave').getBoundingClientRect();return clamp(view.start+(e.clientX-rect.left)/rect.width*(view.end-view.start),0,report.duration)}
function beginDrag(e,kind){if(e.button!==0)return;e.preventDefault();e.stopPropagation();const r=current();if(!intervalValid(r))return;drag={kind,pointer:e.pointerId,target:e.currentTarget,at:atPointer(e),start:r.start,end:r.end};e.currentTarget.setPointerCapture(e.pointerId)}
function moveDrag(e){if(!drag||drag.pointer!==e.pointerId)return;const r=current(),delta=atPointer(e)-drag.at;if(drag.kind==='move'){const d=clamp(delta,-drag.start,report.duration-drag.end);r.start=drag.start+d;r.end=drag.end+d}else if(drag.kind==='start')r.start=clamp(drag.start+delta,0,r.end-.02);else r.end=clamp(drag.end+delta,r.start+.02,report.duration);changed()}
function endDrag(e){if(!drag||drag.pointer!==e.pointerId)return;drag=null;persist()}
$('region').onpointerdown=e=>beginDrag(e,'move');$('startHandle').onpointerdown=e=>beginDrag(e,'start');$('endHandle').onpointerdown=e=>beginDrag(e,'end');for(const e of [$('region'),$('startHandle'),$('endHandle')]){e.onpointermove=moveDrag;e.onpointerup=endDrag;e.onpointercancel=endDrag;e.onlostpointercapture=()=>{drag=null}}
for(const [id,which] of [['startHandle','start'],['endHandle','end']])$(id).onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setBound(which,current()[which]+(e.key==='ArrowLeft'?-1:1)*(e.shiftKey ? .1 : .02))}};
$('wave').onclick=e=>{stopAt=Infinity;audio.currentTime=atPointer(e);updateClock()};
$('start').oninput=()=>{current().start=$('start').valueAsNumber;current().reviewed=false;current().check.checked=false;validate();draw();queueSave();if(Number.isFinite(stopAt))stopAt=previewEnd()};$('end').oninput=()=>{current().end=$('end').valueAsNumber;current().reviewed=false;current().check.checked=false;validate();draw();queueSave();if(Number.isFinite(stopAt))stopAt=previewEnd()};
document.querySelectorAll('[data-bound]').forEach(b=>b.onclick=()=>setBound(b.dataset.bound,current()[b.dataset.bound]+Number(b.dataset.delta)));
$('markStart').onclick=()=>setBound('start',audio.currentTime);$('markEnd').onclick=()=>setBound('end',audio.currentTime);$('preview').onclick=()=>preview();$('toggle').onclick=()=>audio.paused?play():audio.pause();$('prev').onclick=()=>select(selected-1);$('next').onclick=()=>select(selected+1);
$('extend').onclick=()=>{$('post').value=clamp(padding('post')+3,0,30);if($('bounded').checked||$('repeat').checked)stopAt=previewEnd();else stopAt=Infinity;focusView();draw();announce('句后留白已增加至 '+padding('post')+' 秒；未改歌词结束时间。');play()};
$('speed').onchange=()=>{audio.playbackRate=+$('speed').value};$('bounded').onchange=()=>{stopAt=$('bounded').checked||$('repeat').checked?previewEnd():Infinity};$('repeat').onchange=()=>{previewStart=Math.max(0,current().start-padding('pre'));stopAt=$('bounded').checked||$('repeat').checked?previewEnd():Infinity};for(const id of ['pre','post'])$(id).onchange=()=>{previewStart=Math.max(0,current().start-padding('pre'));if(Number.isFinite(stopAt))stopAt=previewEnd();focusView();draw()};
$('zoomIn').onclick=()=>{scale=clamp(scale/1.5,.3,8);focusView();draw()};$('zoomOut').onclick=()=>{scale=clamp(scale*1.5,.3,8);focusView();draw()};$('seek').oninput=()=>{stopAt=Infinity;audio.currentTime=$('seek').valueAsNumber;updateClock()};$('issuesOnly').onchange=filterRows;
$('save').onclick=()=>{persist();download(progress(),report.id+'.review-progress.json');announce('已导出进度备份，包含未完成句和已听核对标记；可以只核对几句后保存。')};
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('进度文件超过2 MB');const data=JSON.parse(await file.text());restore(data);buildRows();select(selected);persist();announce('已载入进度；候选与音频标识匹配。')}catch(e){announce('未载入：'+e.message)}finally{$('import').value=''}};
$('export').onclick=()=>{validate();if($('export').disabled)return;download({schemaVersion:2,id:report.id,reviewKey:report.reviewKey,reviewFile:report.reviewFile,audioSha256:report.audioSha256,model:report.model,status:'listening_reviewed',lines:rows.map(r=>({line:r.line,start:r.start,end:r.end,text:r.text.trim()}))},report.id+'.reviewed.json')};
$('audioFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;const track=report.id,expected=report.audioSha256;audio.pause();stopAt=Infinity;audioVerified.set(track,false);validate();try{if(!globalThis.crypto?.subtle)throw Error('此浏览器不能验证本地文件，请使用页面默认原曲');const bytes=await file.arrayBuffer(),hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');if(hash!==expected)throw Error('文件与候选原曲不一致，未替换音频');const old=audioOverrides.get(track);if(old)URL.revokeObjectURL(old);const u=URL.createObjectURL(file);audioOverrides.set(track,u);audioVerified.set(track,true);if(report.id===track){audio.src=u;validate();announce('已验证并载入本地原曲：'+file.name)}}catch(error){if(report.id===track)announce(error.message+'。已禁用完整复核导出；重新载入正确原曲后恢复。')}};
audio.ontimeupdate=updateClock;audio.onloadedmetadata=()=>{audio.playbackRate=+$('speed').value;if(Math.abs(audio.duration-report.duration)>.25)announce('注意：所选音频时长与候选原曲不同，请确认文件版本。');draw()};audio.onplay=()=>{if(Number.isFinite(stopAt)&&audio.currentTime>=stopAt-.03)stopAt=Infinity;if(!frame)frame=requestAnimationFrame(tick)};audio.onpause=()=>{if(frame)cancelAnimationFrame(frame);frame=0;updateClock()};audio.onerror=()=>announce('音频加载失败：可用“选择本地原曲”选择项目内的对应MP3；无需上传。');
song.onchange=()=>{persist();render()};window.addEventListener('pagehide',persist);window.addEventListener('beforeunload',persist);document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.code==='Space'){e.preventDefault();audio.paused?play():audio.pause()}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();stopAt=Infinity;audio.currentTime=clamp(audio.currentTime+(e.key==='ArrowLeft'?-.25:.25),0,report.duration);updateClock()}});new ResizeObserver(draw).observe($('waveWrap'));render();
</script></html>
